<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="root"></div>
<script type="module">
import { esc, fmtMiles, fmtPaceFromSpeed, fmtDayLabel, renderMarkdown } from "/lib.js";

const NAV = '<nav class="nav">' +
  '<a href="/" class="on">Today</a>' +
  '<a href="/journal.html">Journal</a>' +
  '<a href="/plan.html">Plan</a></nav>';

function splitRows(splits) {
  if (!splits || !splits.length) return "";
  const paces = splits.map(s => s.average_speed > 0 ? 1609.34 / s.average_speed : 0);
  const slowest = Math.max(...paces);
  return splits.map((s, i) => {
    const pace = paces[i];
    const width = slowest > 0 ? Math.round((pace / slowest) * 100) : 0;
    const isSlowest = pace === slowest;
    return '<div class="mrow">' +
      '<span class="mi">' + (i + 1) + '</span>' +
      '<span class="track"><i class="' + (isSlowest ? "slow" : "") + '" style="width:' + width + '%"></i></span>' +
      '<span class="pc">' + fmtPaceFromSpeed(s.average_speed) + '</span>' +
      '<span class="hr">' + (s.average_heartrate ? Math.round(s.average_heartrate) : "--") + '</span>' +
      '</div>';
  }).join("");
}

/* The lede is the narrative's first paragraph. The full analysis lives on the
   entry page; Today shows only the headline finding. */
function ledeOf(narrative) {
  if (!narrative) return "";
  const first = narrative.split(/\n\s*\n/).find(p => p.trim() && !p.trim().startsWith("#"));
  return first ? '<div class="body" style="margin-top:15px">' + renderMarkdown(first) + '</div>' : "";
}

function render(d) {
  let h = NAV;

  h += '<div class="block">';
  h += '<div class="kicker">' + esc(fmtDayLabel(d.date));
  if (d.week) h += ' &middot; Week ' + d.week.number + ' &middot; ' + esc(d.week.phaseName);
  h += '</div>';
  if (d.plan) {
    h += '<div class="h1">' + esc(d.plan.label) + '</div>';
    if (d.plan.detail) h += '<div style="font:500 13.5px var(--sans);opacity:.88">' + esc(d.plan.detail) + '</div>';
  } else {
    h += '<div class="h1">Rest</div>';
  }
  h += '<div class="chips">';
  if (d.next) h += '<div class="chip">Next <b>' + esc(d.next.label) + '</b></div>';
  if (d.race) h += '<div class="chip">Race in <b>' + d.race.daysAway + 'd</b></div>';
  h += '</div></div>';

  h += '<div class="pad"><div class="split2"><div>';
  const r = d.lastRun;
  if (r) {
    h += '<div class="kicker">Last out &middot; ' + esc(fmtDayLabel(r.date)) + ' &middot; ' + esc(r.name) + '</div>';
    h += '<div class="big" style="margin-top:11px"><b>' + fmtMiles(r.distance) + '</b><em>mi</em>' +
         '<b class="sec">' + fmtPaceFromSpeed(r.average_speed) + '</b><em>/mi</em></div>';
    h += '<div class="chips">';
    if (r.average_heartrate) h += '<div class="chip light">HR <b>' + Math.round(r.average_heartrate) + '</b></div>';
    if (r.weather && r.weather.feels != null) h += '<div class="chip light">feels <b>' + Math.round(r.weather.feels) + '&deg;</b></div>';
    h += '</div>';
    h += '<div style="margin-top:18px">' + splitRows(r.splits) + '</div>';
    h += ledeOf(r.narrative);
    h += '<div style="margin-top:12px"><a href="/entry.html?id=' + r.strava_id +
         '" style="font:800 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-decoration:none">Full analysis &rarr;</a></div>';
  } else {
    h += '<div class="kicker">No runs yet</div>';
  }
  h += '</div><div>';

  h += '<div class="sec-h" style="margin-top:26px">Where you are</div>';
  d.weeks.forEach((w, i) => {
    const pct = w.plannedMiles > 0 ? Math.min(100, Math.round((w.actualMiles / w.plannedMiles) * 100)) : 0;
    h += '<div class="wstrip"' + (i === 0 ? ' style="border-top:none"' : '') + '>' +
      '<span class="lab' + (w.current ? " now" : "") + '">Week ' + w.number + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
      '<span class="val' + (w.actualMiles === 0 ? " dim" : "") + '">' + w.actualMiles.toFixed(1) +
      '<span style="color:var(--ink3)">/' + w.plannedMiles + '</span></span></div>';
  });
  if (d.week && d.week.phaseDescription) {
    h += '<div class="body" style="margin-top:14px"><p>' + esc(d.week.phaseDescription) + '</p></div>';
  }
  h += '</div></div></div>';

  document.getElementById("root").innerHTML = h;
}

fetch("/api/today").then(r => r.json()).then(render).catch(e => {
  document.getElementById("root").innerHTML = NAV +
    '<div class="pad"><div class="body">Could not load: ' + esc(e.message) + '</div></div>';
});
</script>
</body>
</html>
