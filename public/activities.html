<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activities</title>
<style>
  :root {
    --surface: #f7f6f3; --card: #ffffff; --card-border: rgba(45,42,38,0.08);
    --ink-primary: #1a1816; --ink-secondary: #5c5650; --ink-muted: #918a82;
    --grid: #e8e5df; --baseline: #c5c0b8;
    --accent: #c0522e; --accent-light: rgba(192,82,46,0.08);
    --blue: #2a6fb5; --blue-light: rgba(42,111,181,0.12);
    --green: #2d7a3a; --green-light: rgba(45,122,58,0.08);
    --amber: #b5850a; --amber-light: rgba(181,133,10,0.08);
    --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #141210; --card: #1e1c19; --card-border: rgba(255,248,235,0.06);
      --ink-primary: #f0ece5; --ink-secondary: #b3aca3; --ink-muted: #7a746c;
      --grid: #2a2723; --baseline: #3d3933;
      --accent: #e06b42; --accent-light: rgba(224,107,66,0.1);
      --blue: #4a9ae0; --blue-light: rgba(74,154,224,0.12);
      --green: #4aad5a; --green-light: rgba(74,173,90,0.1);
      --amber: #d4a520; --amber-light: rgba(212,165,32,0.1);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--surface); color: var(--ink-primary); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .page { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }

  nav { display: flex; gap: 24px; margin-bottom: 32px; font-size: 13px; }
  nav a { color: var(--ink-muted); text-decoration: none; }
  nav a:hover { color: var(--ink-primary); }
  nav a.active { color: var(--ink-primary); font-weight: 600; }

  h1 { font-size: 26px; font-weight: 400; margin-bottom: 6px; font-family: Charter, Georgia, serif; }
  .subtitle { font-size: 14px; color: var(--ink-muted); margin-bottom: 24px; }

  .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 16px 20px; min-width: 140px; flex: 1;
  }
  .stat-value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-top: 2px; }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
  }
  .toolbar select, .toolbar input {
    font-family: var(--font); font-size: 13px; padding: 6px 10px;
    background: var(--card); color: var(--ink-primary);
    border: 1px solid var(--card-border); border-radius: 6px;
  }
  .btn {
    font-family: var(--font); font-size: 13px; font-weight: 500;
    padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--ink-secondary); }
  .btn-outline:hover { border-color: var(--ink-muted); }

  .sync-status { font-size: 12px; color: var(--ink-muted); margin-left: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-muted); font-weight: 500; padding: 8px 8px; border-bottom: 1px solid var(--baseline);
  }
  thead th.num { text-align: right; }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  tbody td.num { text-align: right; }
  tbody tr:hover { background: var(--accent-light); }
  .type-badge {
    font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 2px 6px; border-radius: 3px;
  }
  .type-Run { background: var(--blue-light); color: var(--blue); }
  .type-WeightTraining { background: var(--amber-light); color: var(--amber); }
  .type-Walk { background: var(--green-light); color: var(--green); }

  .name-cell a { color: var(--ink-primary); text-decoration: none; }
  .name-cell a:hover { color: var(--blue); text-decoration: underline; }
  .name-cell .edit-btn {
    cursor: pointer; font-size: 11px; color: var(--ink-muted); margin-left: 4px;
    opacity: 0; transition: opacity 0.1s;
  }
  .name-cell:hover .edit-btn { opacity: 1; }
  .name-input {
    font-family: var(--font); font-size: 13px; padding: 2px 6px;
    background: var(--card); color: var(--ink-primary);
    border: 1px solid var(--blue); border-radius: 4px; width: 100%;
    outline: none;
  }
  .name-saving { color: var(--ink-muted); font-style: italic; }

  .empty { text-align: center; padding: 48px; color: var(--ink-muted); }
  .empty p { margin-bottom: 12px; }

  .connect-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 32px; text-align: center; margin-bottom: 24px;
  }
  .connect-card h2 { font-size: 18px; font-weight: 400; margin-bottom: 8px; font-family: Charter, Georgia, serif; }
  .connect-card p { font-size: 13px; color: var(--ink-secondary); margin-bottom: 16px; }
  .btn-strava {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fc4c02; color: #fff; font-size: 14px; font-weight: 600;
    padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
    text-decoration: none;
  }
  .btn-strava:hover { opacity: 0.9; }

  .detail-row td { padding: 0; border-bottom: 1px solid var(--grid); }
  .detail-content {
    padding: 16px 24px;
    background: var(--card); border-top: 1px solid var(--card-border);
  }
  .split-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
  .split-table th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--grid);
  }
  .split-table th.num { text-align: right; }
  .split-table td { padding: 6px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .split-table td.num { text-align: right; }
  .split-table tr:last-child td { border-bottom: none; }
  .narrative-card {
    background: var(--surface); border: 1px solid var(--card-border); border-radius: 6px;
    padding: 16px; font-size: 13px; line-height: 1.6; color: var(--ink-secondary);
    white-space: pre-wrap;
  }
  .narrative-card strong { color: var(--ink-primary); }
  tbody tr.run-row { cursor: pointer; }
  tbody tr.run-row:hover { background: var(--blue-light); }
  tbody tr.expanded { background: var(--blue-light); }
</style>
</head>
<body>
<div class="page">
  <nav>
    <a href="/">Plan</a>
    <a href="/activities.html" class="active">Activities</a>
    <a href="/analysis.html">Analysis</a>
  </nav>

  <h1>Activities</h1>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div id="connect-prompt" style="display:none">
    <div class="connect-card">
      <h2>Connect to Strava</h2>
      <p>Link your Strava account to sync your activities.</p>
      <a href="/auth/strava" class="btn-strava">Connect with Strava</a>
    </div>
  </div>

  <div id="main-content" style="display:none">
    <div class="stats-row" id="stats-row"></div>

    <div class="toolbar">
      <select id="type-filter">
        <option value="">All types</option>
        <option value="Run">Runs</option>
        <option value="WeightTraining">Weight Training</option>
        <option value="Walk">Walks</option>
      </select>
      <input type="date" id="after-filter" title="After date">
      <button class="btn btn-primary" id="sync-btn">Sync from Strava</button>
      <span class="sync-status" id="sync-status"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Type</th>
          <th class="num">Distance</th>
          <th class="num">Time</th>
          <th class="num">Pace</th>
          <th class="num">Avg HR</th>
          <th class="num">Weather</th>
        </tr>
      </thead>
      <tbody id="activity-table"></tbody>
    </table>

    <div class="empty" id="empty-state" style="display:none">
      <p>No activities yet.</p>
      <button class="btn btn-primary" id="sync-btn-empty">Sync from Strava</button>
    </div>
  </div>
</div>

<script>
  const $ = (s) => document.getElementById(s);
  const statusEl = $('sync-status');
  const tableEl = $('activity-table');

  function metersToMiles(m) { return (m / 1609.34).toFixed(2); }
  function formatTime(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }
  function formatPace(speedMs) {
    if (!speedMs) return '--';
    const paceMin = 1609.34 / speedMs / 60;
    const m = Math.floor(paceMin);
    const s = Math.round((paceMin - m) * 60);
    return `${m}:${String(s).padStart(2,'0')}/mi`;
  }
  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function weatherIcon(code) {
    if (code == null) return '';
    if (code === 0) return '☀️';
    if (code <= 3) return '⛅';
    if (code <= 49) return '🌫️';
    if (code <= 69) return '🌧️';
    if (code <= 79) return '❄️';
    if (code <= 82) return '🌧️';
    if (code >= 95) return '⛈️';
    return '☁️';
  }
  function weatherCell(a) {
    if (a.weather_temp == null) return '--';
    const icon = weatherIcon(a.weather_code);
    return icon + ' ' + Math.round(a.weather_feels) + '°F';
  }
  function typeBadge(type) {
    const label = type === 'WeightTraining' ? 'Weights' : type;
    return `<span class="type-badge type-${type}">${label}</span>`;
  }

  function splitPace(speedMs) {
    if (!speedMs) return '--';
    const paceMin = 1609.34 / speedMs / 60;
    const m = Math.floor(paceMin);
    const s = Math.round((paceMin - m) * 60);
    return m + ':' + String(s).padStart(2, '0') + '/mi';
  }

  function elevFt(meters) {
    if (meters == null) return '--';
    const ft = meters * 3.281;
    return (ft >= 0 ? '+' : '') + Math.round(ft) + ' ft';
  }

  function renderSplitTable(splits) {
    let html = '<table class="split-table"><thead><tr>';
    html += '<th>Mile</th><th class="num">Pace</th><th class="num">HR</th><th class="num">Elev</th><th class="num">Zone</th>';
    html += '</tr></thead><tbody>';
    for (const s of splits) {
      html += '<tr>';
      html += '<td>' + (s.split_index + 1) + '</td>';
      html += '<td class="num">' + splitPace(s.average_speed) + '</td>';
      html += '<td class="num">' + (s.average_heartrate ? Math.round(s.average_heartrate) : '--') + '</td>';
      html += '<td class="num">' + elevFt(s.elevation_diff) + '</td>';
      html += '<td class="num">' + (s.pace_zone || '--') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  let expandedRow = null;

  async function toggleDetail(tr, stravaId) {
    const existing = tr.nextElementSibling;
    if (existing && existing.classList.contains('detail-row')) {
      existing.remove();
      tr.classList.remove('expanded');
      expandedRow = null;
      return;
    }

    if (expandedRow) {
      const prev = expandedRow.nextElementSibling;
      if (prev && prev.classList.contains('detail-row')) prev.remove();
      expandedRow.classList.remove('expanded');
    }

    const detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    const td = document.createElement('td');
    td.colSpan = 8;
    td.innerHTML = '<div class="detail-content"><p style="color:var(--ink-muted);font-size:12px;">Loading splits...</p></div>';
    detailTr.appendChild(td);
    tr.after(detailTr);
    tr.classList.add('expanded');
    expandedRow = tr;

    try {
      const splitsRes = await fetch('/api/activities/' + stravaId + '/splits');
      let html = '';
      if (splitsRes.ok) {
        const data = await splitsRes.json();
        html += renderSplitTable(data.splits);
      } else {
        html += '<p style="color:var(--ink-muted);font-size:12px;">No split data available.</p>';
      }

      const fbRes = await fetch('/api/activities/' + stravaId + '/feedback');
      if (fbRes.ok) {
        const fb = await fbRes.json();
        html += '<div class="narrative-card">' + fb.narrative.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</div>';
      }

      td.innerHTML = '<div class="detail-content">' + html + '</div>';
    } catch (e) {
      td.innerHTML = '<div class="detail-content"><p style="color:var(--accent);">Failed to load details.</p></div>';
    }
  }

  function restoreNameCell(cell, name) {
    const stravaId = cell.dataset.stravaId;
    cell.innerHTML = '<a href="https://www.strava.com/activities/' + stravaId + '" target="_blank" rel="noopener">' + (name || '--') + '</a><span class="edit-btn" title="Rename">&#9998;</span>';
    cell.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); startRename(cell); });
  }

  function startRename(cell) {
    if (cell.querySelector('input')) return;
    const stravaId = cell.dataset.stravaId;
    const currentName = cell.dataset.name;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'name-input';
    input.value = currentName;
    cell.innerHTML = '';
    cell.appendChild(input);
    input.focus();
    input.select();

    function commit() {
      const newName = input.value.trim();
      if (!newName || newName === currentName) {
        restoreNameCell(cell, currentName);
        return;
      }
      cell.innerHTML = '<span class="name-saving">' + newName + '</span>';
      fetch('/api/activities/' + stravaId + '/name', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName }),
      }).then(r => r.json()).then(data => {
        if (data.error) {
          restoreNameCell(cell, currentName);
          statusEl.textContent = 'Rename failed: ' + data.error;
        } else {
          cell.dataset.name = newName;
          restoreNameCell(cell, newName);
          statusEl.textContent = 'Renamed on Strava';
        }
      }).catch(e => {
        restoreNameCell(cell, currentName);
        statusEl.textContent = 'Rename failed: ' + e.message;
      });
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); restoreNameCell(cell, currentName); }
    });
  }

  async function loadStatus() {
    const res = await fetch('/api/status');
    const data = await res.json();

    if (!data.authenticated && data.activityCount === 0) {
      $('connect-prompt').style.display = '';
      $('subtitle').textContent = 'Connect your Strava account to get started.';
      return;
    }

    $('main-content').style.display = '';
    const name = data.athlete?.firstname ? `${data.athlete.firstname}'s activities` : 'Your activities';
    $('subtitle').textContent = data.lastSynced
      ? `${data.activityCount} activities synced. Last: ${formatDate(data.lastSynced)}`
      : 'No activities synced yet. Hit "Sync from Strava" to pull your data.';

    renderStats(data);
    loadActivities();
  }

  function renderStats(status) {
    $('stats-row').innerHTML = `
      <div class="stat"><div class="stat-value">${status.activityCount}</div><div class="stat-label">Activities</div></div>
    `;
  }

  async function loadActivities() {
    const type = $('type-filter').value;
    const after = $('after-filter').value;
    const params = new URLSearchParams();
    if (type) params.set('type', type);
    if (after) params.set('after', after);

    const res = await fetch('/api/activities?' + params);
    const activities = await res.json();

    if (!activities.length) {
      tableEl.innerHTML = '';
      $('empty-state').style.display = '';
      return;
    }

    $('empty-state').style.display = 'none';
    tableEl.innerHTML = activities.map(a => `
      <tr${a.type === 'Run' && a.distance > 0 ? ' class="run-row" data-strava-id="' + a.strava_id + '"' : ''}>
        <td>${formatDate(a.start_date_local)}</td>
        <td class="name-cell" data-strava-id="${a.strava_id}" data-name="${(a.name || '').replace(/"/g, '&quot;')}"><a href="https://www.strava.com/activities/${a.strava_id}" target="_blank" rel="noopener">${a.name || '--'}</a><span class="edit-btn" title="Rename">&#9998;</span></td>
        <td>${typeBadge(a.type)}</td>
        <td class="num">${a.distance ? metersToMiles(a.distance) + ' mi' : '--'}</td>
        <td class="num">${a.moving_time ? formatTime(a.moving_time) : '--'}</td>
        <td class="num">${a.type === 'Run' ? formatPace(a.average_speed) : '--'}</td>
        <td class="num">${a.average_heartrate ? Math.round(a.average_heartrate) : '--'}</td>
        <td class="num" title="${a.weather_temp != null ? Math.round(a.weather_temp) + '°F actual, ' + a.weather_humidity + '% humidity, ' + Math.round(a.weather_wind) + ' mph wind' : ''}">${weatherCell(a)}</td>
      </tr>
    `).join('');

    tableEl.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); startRename(btn.closest('.name-cell')); });
    });

    tableEl.querySelectorAll('.run-row').forEach(tr => {
      tr.addEventListener('click', (e) => {
        if (e.target.closest('.name-cell') || e.target.closest('.edit-btn') || e.target.tagName === 'A' || e.target.tagName === 'INPUT') return;
        toggleDetail(tr, tr.dataset.stravaId);
      });
    });
  }

  async function doSync(full = false) {
    const btns = document.querySelectorAll('[id^=sync-btn]');
    btns.forEach(b => { b.disabled = true; b.textContent = 'Syncing...'; });
    statusEl.textContent = 'Pulling activities from Strava...';

    try {
      const res = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      statusEl.textContent = `Synced ${data.fetched} activities (${data.total} total)`;
      loadStatus();
    } catch (e) {
      statusEl.textContent = 'Sync failed: ' + e.message;
    } finally {
      btns.forEach(b => { b.disabled = false; b.textContent = 'Sync from Strava'; });
    }
  }

  $('sync-btn').addEventListener('click', () => doSync());
  $('sync-btn-empty')?.addEventListener('click', () => doSync());
  $('type-filter').addEventListener('change', loadActivities);
  $('after-filter').addEventListener('change', loadActivities);

  loadStatus();
</script>
</body>
</html>
