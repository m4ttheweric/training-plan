<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="root"></div>
<script type="module">
import { esc, fmtDayLabel, localDate } from "/lib.js";
import { autoSync } from "/sync.js";

const NAV = '<nav class="nav">' +
  '<a href="/">Today</a>' +
  '<a href="/journal.html">Journal</a>' +
  '<a href="/plan.html" class="on">Plan</a></nav>';

const HEADS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const today = localDate();

function cellClass(type) {
  if (type === "run") return "run";
  if (type === "long" || type === "race") return "long";
  if (type === "lift") return "lift";
  return "";
}

function cell(day) {
  if (day.plan.type === "rest") return '<td><div class="restcell">rest</div></td>';

  const isToday = day.date === today;
  let tick = "";
  if (day.status === "completed") tick = '<span class="tick ok">&check;' + (day.shiftedFrom ? "&#8614;" : "") + '</span>';
  else if (day.status === "missed") tick = '<span class="tick no">&times;</span>';
  else if (day.status === "partial") tick = '<span class="tick">&frac12;</span>';
  else if (isToday) tick = '<span class="tick">today</span>';
  /* Always emit the tick line, even empty. Only the current week mixes
     ticked and unticked days, so without this its cells are a line shorter
     than their neighbours and the row looks ragged. */
  else tick = '<span class="tick"></span>';

  const label = day.plan.miles != null ? String(day.plan.miles) : esc(String(day.plan.label).slice(0, 2));
  return '<td><div class="cellbox ' + (isToday ? "now" : cellClass(day.plan.type)) + '">' + label + tick + '</div></td>';
}

function recoverySection(rec) {
  if (!rec || !rec.weeks || !rec.weeks.length) return "";
  const maxMiles = Math.max(1, ...rec.weeks.map(w => w.miles || 0));
  const target = rec.target || 8;
  const adequate = rec.adequate || 7;

  let h = '<div class="sec-h">Sleep vs load</div>';
  h += '<div class="body" style="margin-bottom:14px">Weekly running miles (load) over nights slept (recovery). ' +
       'Sleep drives the overnight tissue repair that training banks, so a long load bar sitting on a short ' +
       'red sleep bar is a week that cost more than it built.</div>';

  h += '<div class="chips" style="margin:0 0 16px">';
  h += '<span class="chip light">plan avg <b>' + (rec.planAvgSleep != null ? rec.planAvgSleep.toFixed(1) : "--") + 'h</b></span>';
  h += '<span class="chip light">weeks &ge;' + adequate + 'h <b>' + rec.weeksAtTarget + '/' + rec.weeksWithSleep + '</b></span>';
  h += '</div>';

  rec.weeks.forEach((w) => {
    const isNow = !!w.current;
    const loadPct = Math.round((Math.max(0, w.miles || 0) / maxMiles) * 100);
    let sval, sleepPct = 0, band = "";
    if (w.nights > 0 && w.avgSleep != null) {
      sleepPct = Math.min(100, Math.round((w.avgSleep / target) * 100));
      band = w.avgSleep >= adequate ? "ok" : (w.avgSleep < 6 ? "low" : "");
      const deep = w.avgDeep != null ? Math.round(w.avgDeep * 60) + "m deep &middot; " : "";
      sval = '<div class="v">' + w.avgSleep.toFixed(1) + 'h<small>' + deep + w.nights + '/7</small></div>';
    } else {
      sval = '<div class="v none">--<small>no sleep</small></div>';
    }

    h += '<div class="slwk">';
    h += '<div class="lab' + (isNow ? " now" : "") + '">' + w.week + (w.recovery ? '<small>rec</small>' : "") + '</div>';
    h += '<div class="bars">';
    h += '<div class="tr"><span class="k">mi</span><div class="mtr"><i class="load" style="width:' + loadPct + '%"></i></div>' +
         '<div class="v">' + (w.miles || 0).toFixed(1) + '</div></div>';
    h += '<div class="tr"><span class="k">slp</span><div class="mtr"><i class="' + band + '" style="width:' + sleepPct + '%"></i></div>' + sval + '</div>';
    h += '</div></div>';
  });
  return h;
}

function render(data, rec) {
  let h = NAV;
  const race = data.plan.race;

  h += '<div class="block"><div class="kicker">' + esc(data.plan.name) + '</div>';
  if (race) {
    const days = Math.round((Date.parse(race.date + "T12:00:00Z") - Date.parse(today + "T12:00:00Z")) / 86400000);
    const weeks = Math.max(0, Math.ceil(days / 7));
    h += '<div class="h1 sm">' + weeks + ' weeks out</div>';
    h += '<div style="font:600 13px var(--sans);opacity:.88">' + esc(fmtDayLabel(race.date)) +
         ' &middot; target ' + esc(race.targetPace) + ' &middot; ' + esc(race.targetTime) + '</div>';
  }
  h += '</div><div class="pad"><div class="gscroll"><table class="gtbl">';

  h += '<tr><th class="wkc"></th>' + HEADS.map(d => '<th>' + d + '</th>').join("") +
       '<th class="sunh">Sun</th><th style="padding-left:9px">Tot</th></tr>';

  for (const w of data.weeks) {
    const cur = w.days.some(d => d.date === today);
    h += '<tr><td class="wkc"' + (cur ? ' style="color:var(--accent)"' : '') + '>Wk ' + w.week + '</td>';
    h += w.days.map(cell).join("");
    const pct = w.summary.plannedMiles > 0
      ? Math.min(100, Math.round((w.summary.actualMiles / w.summary.plannedMiles) * 100)) : 0;
    const shown = w.summary.actualMiles > 0 ? w.summary.actualMiles.toFixed(1) : String(w.summary.plannedMiles);
    h += '<td class="gtot">' + shown + '<div class="wkbar"><i style="width:' + pct + '%"></i></div></td></tr>';
  }
  h += '</table></div>';

  h += recoverySection(rec);

  for (const p of data.plan.phases) {
    h += '<div class="sec-h">' + esc(p.name) + ' &middot; ' + esc(p.tag) + '</div>';
    h += '<div class="body"><p>' + esc(p.description) + '</p></div>';
  }
  if (data.plan.rules && data.plan.rules.length) {
    h += '<div class="sec-h">Ground rules</div><div class="body">';
    for (const r of data.plan.rules) h += '<p><b>' + esc(r.label) + '.</b> ' + esc(r.text) + '</p>';
    h += '</div>';
  }
  h += '</div>';
  document.getElementById("root").innerHTML = h;
}

/* Recovery is a best-effort companion to the plan grid: if its fetch fails the
   page still renders the plan, just without the scorecard. */
function loadPlan() {
  return Promise.all([
    fetch("/api/plan/status").then(r => r.json()),
    fetch("/api/stats/recovery").then(r => r.json()).catch(() => null),
  ]);
}

function paint([data, rec]) { render(data, rec); }

/* First paint renders from whatever data is already on disk; the sync
   below runs in the background and only triggers a quiet re-fetch if it
   actually did something. No spinner, no clearing the page mid-sync. */
loadPlan().then(paint).catch(e => {
  document.getElementById("root").innerHTML = NAV +
    '<div class="pad"><div class="body">Could not load: ' + esc(e.message) + '</div></div>';
});

autoSync().then((result) => {
  if (!result.ran) return;
  // Quiet refresh: keep showing the last good render if this fails.
  loadPlan().then(paint).catch(() => {});
});
</script>
</body>
</html>
