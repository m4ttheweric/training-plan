<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell" id="root"></div>
<script type="module">
import { esc, fmtMiles, fmtPaceFromSpeed, fmtDuration, fmtDayLabel, localDate } from "/lib.js";
import { autoSync, manualSync, waitForSyncDone } from "/sync.js";

const NAV = '<nav class="nav">' +
  '<a href="/">Today</a>' +
  '<a href="/journal.html" class="on">Journal</a>' +
  '<a href="/plan.html">Plan</a></nav>';

function runItem(it, isTarget) {
  const a = it.activity;
  const dot = it.kind === "long" ? "long" : "run";
  let meta = "";
  if (it.shiftedFrom) meta += "Ran " + esc(fmtDayLabel(it.date)) + " for " + esc(fmtDayLabel(it.shiftedFrom)) + "'s slot. ";
  if (a.weather && a.weather.feels != null) meta += Math.round(a.weather.feels) + "&deg;F.";
  return '<a class="fitem"' + (isTarget ? ' id="j-today"' : '') + ' href="/entry.html?id=' + a.strava_id + '">' +
    '<span class="fdot ' + dot + '"></span>' +
    '<div class="fwhen">' + esc(fmtDayLabel(it.date)) + ' &middot; ' + esc(a.name) + '</div>' +
    '<div class="fhead">' + fmtMiles(a.distance) + '<span class="u">mi</span> &middot; ' +
      fmtPaceFromSpeed(a.average_speed) + '<span class="u">/mi</span>' +
      (a.average_heartrate ? ' &middot; ' + Math.round(a.average_heartrate) + '<span class="u">bpm</span>' : '') +
    '</div>' +
    (meta ? '<div class="fmeta">' + meta + '</div>' : '') +
    '</a>';
}

/* status.lastSyncCompletedAt is a real timestamp (when a sync last actually
   finished), not just a calendar date, so this shows the time alongside the
   day -- localDate() first, to read the day the same local-timezone-safe
   way fmtDayLabel expects, rather than slicing the UTC ISO string directly. */
function fmtSyncedAt(iso) {
  if (!iso) return "Never";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "Never";
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return fmtDayLabel(localDate(d)) + " " + time;
}

/* Sync header: last-synced state, a sync trigger, and a Strava connect link
   when the token has gone stale. This is the one mutating control in the
   app -- it does not violate the "no mark done" rule, since it only pulls
   fresh Strava data and workout completion still comes from Strava. */
function syncHeader(status) {
  const synced = fmtSyncedAt(status.lastSyncCompletedAt);
  let h = '<div class="pad syncbar">';
  h += '<div><div class="kicker">Sync</div><div class="body">Last synced ' + esc(synced) + '</div></div>';
  h += '<div class="syncctl">';
  h += '<button type="button" class="chip light chipbtn" id="syncBtn">' +
    (status.syncing ? "Syncing..." : "Sync now") + '</button>';
  if (!status.authenticated) h += '<a class="chip light chipbtn" href="/auth/strava">Connect with Strava</a>';
  h += '</div></div>';
  return h;
}

/* The item to land the viewport on: normally the "today" entry, but a rest
   day emits no "today" item at all (see buildJournal in src/journal.ts),
   so this falls back to the first item that isn't still in the future --
   the most recent past entry, since the feed is already newest-first.
   A week-rule can never be that first item: a week only earns a rule once
   it has a real result, and that result always precedes its own week's
   rule in the feed. */
function scrollTargetIndex(items) {
  return items.findIndex(it => it.kind !== "future" && it.kind !== "week-rule");
}

function feedHtml(items) {
  const targetIdx = scrollTargetIndex(items);
  let h = '<div class="pad">';
  let open = false;

  items.forEach((it, idx) => {
    const idAttr = idx === targetIdx ? ' id="j-today"' : '';

    if (it.kind === "week-rule") {
      if (open) { h += '</div>'; open = false; }
      h += '<div class="wkrule"><i></i><span>Week ' + it.week +
        (it.recovery ? " &middot; recovery" : "") + ' &middot; ' +
        it.actualMiles.toFixed(1) + '/' + it.plannedMiles + ' mi &middot; ' +
        it.completedRuns + '/' + it.plannedRuns + ' runs</span><i></i></div>';
      return;
    }
    if (!open) { h += '<div class="feed">'; open = true; }

    if (it.kind === "run" || it.kind === "long") { h += runItem(it, idx === targetIdx); return; }

    if (it.kind === "lift") {
      h += '<span class="fitem"' + idAttr + '><span class="fdot lift"></span>' +
        '<div class="fwhen">' + esc(fmtDayLabel(it.date)) + '</div>' +
        '<div class="fhead lift">' + esc(it.label) + ' &middot; ' + fmtDuration(it.activity.moving_time) + '</div></span>';
      return;
    }
    if (it.kind === "missed") {
      h += '<span class="fitem"' + idAttr + '><span class="fdot miss"></span>' +
        '<div class="fwhen">' + esc(fmtDayLabel(it.date)) + '</div>' +
        '<div class="fhead miss">' + esc(it.label) + ' ... missed</div></span>';
      return;
    }
    if (it.kind === "today") {
      h += '<span class="fitem now"' + idAttr + '><span class="fdot today"></span>' +
        '<div class="fwhen now">Today &middot; ' + esc(fmtDayLabel(it.date)) + '</div>' +
        '<div class="fhead" style="color:var(--accent)">' + esc(it.label) + '</div>' +
        (it.detail ? '<div class="fmeta">' + esc(it.detail) + '</div>' : '') + '</span>';
      return;
    }
    if (it.kind === "future") {
      h += '<span class="fitem future"><span class="fdot"></span>' +
        '<div class="fwhen">' + esc(fmtDayLabel(it.date)) + '</div>' +
        '<div class="fhead lift">' + esc(it.label) + (it.detail ? " " + esc(it.detail) : "") + '</div></span>';
    }
  });
  if (open) h += '</div>';
  h += '</div>';
  return h;
}

function render(status, items) {
  document.getElementById("root").innerHTML = NAV + syncHeader(status) + feedHtml(items);

  const btn = document.getElementById("syncBtn");
  if (!btn) return;
  if (status.syncing) {
    btn.disabled = true;
    waitForSyncDone().then(main).catch(() => { btn.disabled = false; btn.textContent = "Sync now"; });
  } else {
    btn.addEventListener("click", () => runSync(btn));
  }
}

async function runSync(btn) {
  btn.disabled = true;
  btn.textContent = "Syncing...";
  try {
    await manualSync();
    await main();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Sync now";
  }
}

/* Scrolls the "now" entry (today, or the rest-day fallback) to the top of
   the viewport. Runs at most once per page load, only after the very first
   render -- never on the quiet re-render that follows a sync, which must
   not yank the page out from under someone mid-read. Also backs off if the
   person has already scrolled before this runs, so a fast scroller is
   never fought. */
let hasAutoScrolled = false;
function scrollToToday() {
  if (hasAutoScrolled) return;
  hasAutoScrolled = true;
  if (window.scrollY > 2) return;
  const target = document.getElementById("j-today");
  if (target) target.scrollIntoView({ block: "start" });
}

let didInitialLoad = false;

async function main() {
  const [status, items] = await Promise.all([
    fetch("/api/status").then(r => r.json()),
    fetch("/api/journal").then(r => r.json()),
  ]);
  render(status, items);

  if (!didInitialLoad) {
    didInitialLoad = true;
    scrollToToday();
    // If a sync is already in flight (from another tab, say), render()
    // above is already waiting on it via waitForSyncDone().then(main); do
    // not also fire our own auto sync on top of it.
    if (!status.syncing) {
      autoSync().then((result) => { if (result.ran) main(); });
    }
  }
}

main().catch(e => {
  document.getElementById("root").innerHTML = NAV +
    '<div class="pad"><div class="body">Could not load: ' + esc(e.message) + '</div></div>';
});
</script>
</body>
</html>
